version: '3.8'

services:
  app:
    build: .
    restart: always
    labels:
      - "traefik.enable=true"
      # Routing
      - "traefik.http.routers.unique-discount-app.rule=Host(`ahmad.project.terzettoo.com`)"
      - "traefik.http.routers.unique-discount-app.entrypoints=websecure"
      - "traefik.http.routers.unique-discount-app.tls.certresolver=letsencrypt"
      # Backend
      - "traefik.http.services.unique-discount-app.loadbalancer.server.port=3000"
      # CRITICAL: Tell Traefik which network to use to reach this container
      - "traefik.docker.network=web"
    environment:
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
      - SCOPES=${SCOPES}
      - SHOPIFY_APP_URL=${SHOPIFY_APP_URL}
      - HOST=${HOST}
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    networks:
      - web
      - mysql-xpsz_default
      - default
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - default

volumes:
  redis_data:

networks:
  default:
    # Internal network for app <-> redis communication
  web:
    # Shared network with Traefik for reverse proxy routing
    external: true
  mysql-xpsz_default:
    # Existing MySQL network
    external: true

